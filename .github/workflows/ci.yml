name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A run takes about 3 minutes. Without a limit, a hung e2e step runs for GitHub's default 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same version as local development; node:sqlite and type stripping need 22.13+.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Typst packages and Python wheels for drawn figures, pinned by SHA-256 in the script. Cached by that file's hash.
      - uses: actions/cache@v4
        with:
          path: .figure-packages
          key: figure-packages-${{ hashFiles('scripts/fetch-figure-packages.mjs') }}
      - run: npm run figure-packages
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @smartbuilder/web
      - name: End-to-end tests (no model calls)
        run: |
          # No --with-deps: it runs apt, which fails the job whenever the runner cannot reach Ubuntu's package servers.
          # The runner image already has the libraries Chromium needs.
          npx playwright install chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
